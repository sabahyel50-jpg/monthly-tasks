<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مذكّر المهام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#ECEAE2;
    --surface:#FFFFFF;
    --ink:#20241D;
    --ink-soft:#5B6157;
    --line:#DAD6C9;
    --pine:#3F5B48;
    --pine-soft:#E4EAE1;
    --bronze:#A67C3D;
    --bronze-soft:#F3E7D2;
    --danger:#A5473A;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh;
  }
  .wrap{ max-width:640px; margin:0 auto; padding:20px 16px 80px; }
  header{ padding:6px 2px 18px; display:flex; justify-content:space-between; align-items:flex-start; }
  header h1{ font-size:22px; font-weight:700; margin:0 0 4px; letter-spacing:-0.2px; }
  header p{ margin:0; color:var(--ink-soft); font-size:14px; }
  .logout{ background:none; border:none; color:var(--ink-soft); font-size:13px; cursor:pointer; text-decoration:underline; }

  .card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:16px; margin-bottom:24px;
  }
  .row{ display:flex; gap:8px; margin-bottom:10px; }
  .row:last-child{margin-bottom:0;}
  input[type=text], input[type=email], input[type=password], textarea, input[type=date]{
    width:100%; border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; font-family:inherit; font-size:14px;
    background:#FCFBF8; color:var(--ink);
  }
  input:focus, textarea:focus{ outline:none; border-color:var(--pine); }
  textarea{resize:none; min-height:38px;}
  .field-date{flex:0 0 150px;}
  .btn{ border:none; border-radius:10px; padding:10px 16px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; }
  .btn-primary{ background:var(--pine); color:#fff; width:100%; }
  .btn-primary:disabled{ opacity:.6; }
  .btn-link{ background:none; color:var(--pine); text-decoration:underline; padding:6px; width:auto; }
  .auth-error{ color:var(--danger); font-size:13px; margin:8px 2px 0; }
  .auth-note{ color:var(--ink-soft); font-size:13px; margin:8px 2px 0; }

  .month-group{margin-bottom:22px;}
  .month-title{ display:flex; align-items:baseline; gap:8px; margin:0 0 10px 4px; padding-bottom:6px; border-bottom:1px solid var(--line); }
  .month-title .name{ font-size:15px; font-weight:700; }
  .month-title .count{ font-size:12px; color:var(--ink-soft); }

  .task{ display:flex; align-items:flex-start; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px; }
  .task.done{opacity:.5;}
  .check{ width:20px;height:20px; border-radius:50%; border:2px solid var(--pine); flex:0 0 20px; margin-top:2px; cursor:pointer; background:transparent; display:flex;align-items:center;justify-content:center; color:#fff; font-size:12px; }
  .task.done .check{background:var(--pine);}
  .task-body{flex:1; min-width:0;}
  .task-title{ font-size:14.5px; font-weight:600; margin:0 0 2px; }
  .task.done .task-title{text-decoration:line-through;}
  .task-note{ font-size:13px; color:var(--ink-soft); margin:0 0 6px; }
  .task-meta{ display:flex; gap:6px; align-items:center; }
  .day-badge{ font-size:12px; font-weight:600; padding:2px 8px; border-radius:20px; background:var(--pine-soft); color:var(--pine); }
  .day-badge.soon{background:var(--bronze-soft); color:var(--bronze);}
  .day-badge.late{background:#F4E1DD; color:var(--danger);}
  .del{ background:none;border:none;color:var(--ink-soft); font-size:18px; cursor:pointer; padding:2px 4px; line-height:1; }
  .empty{ text-align:center; color:var(--ink-soft); font-size:14px; padding:40px 10px; }
  .hidden{display:none !important;}
  .sync-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--pine); margin-left:6px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- AUTH SCREEN -->
  <div id="authScreen">
    <header><div><h1>مذكّر المهام</h1><p>سجّل دخولك عشان تزامن مهامك بين أجهزتك</p></div></header>
    <div class="card">
      <div class="row"><input type="email" id="authEmail" placeholder="البريد الإلكتروني"></div>
      <div class="row"><input type="password" id="authPassword" placeholder="كلمة المرور"></div>
      <div class="row"><button class="btn btn-primary" id="signInBtn">تسجيل الدخول</button></div>
      <div class="row"><button class="btn btn-link" id="signUpBtn">مفيش حساب؟ أنشئ حساب جديد</button></div>
      <p class="auth-error hidden" id="authError"></p>
      <p class="auth-note" id="authNote"></p>
    </div>
  </div>

  <!-- APP SCREEN -->
  <div id="appScreen" class="hidden">
    <header>
      <div><h1>مذكّر المهام</h1><p><span class="sync-dot"></span>متزامن</p></div>
      <button class="logout" id="logoutBtn">خروج</button>
    </header>

    <div class="card">
      <div class="row">
        <input type="text" id="title" placeholder="اسم المهمة">
        <input type="date" id="date" class="field-date">
      </div>
      <div class="row"><textarea id="note" placeholder="ملاحظة (اختياري)"></textarea></div>
      <button class="btn btn-primary" id="addBtn">إضافة مهمة</button>
    </div>

    <div id="list"></div>
  </div>

</div>

<script>
// ==== 1) عدّل السطرين دول ببيانات مشروع Supabase بتاعك ====
const SUPABASE_URL = 'https://tpvojxgsebxitahvnaxp.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwdm9qeGdzZWJ4aXRhaHZuYXhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMDA2OTUsImV4cCI6MjEwNDc3NjY5NX0.IFIKXz1BaiFIH9BuF8561v5eRFWo6pit9aXUlqIeJzc';
// ============================================================

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let tasks = [];
let currentUser = null;

const monthNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function dayLabel(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr); d.setHours(0,0,0,0);
  const diff = Math.round((d - today) / 86400000);
  if(diff === 0) return {text:'اليوم', cls:'soon'};
  if(diff === 1) return {text:'غدًا', cls:'soon'};
  if(diff < 0) return {text:'متأخرة ' + Math.abs(diff) + ' يوم', cls:'late'};
  if(diff <= 7) return {text:'بعد ' + diff + ' أيام', cls:'soon'};
  return {text: d.getDate() + ' ' + monthNames[d.getMonth()], cls:''};
}

function render(){
  const list = document.getElementById('list');
  if(tasks.length === 0){
    list.innerHTML = '<div class="empty">لا توجد مهام بعد. أضف أول مهمة من الأعلى.</div>';
    return;
  }
  const sorted = [...tasks].sort((a,b) => new Date(a.date) - new Date(b.date));
  const groups = {};
  sorted.forEach(t => {
    const d = new Date(t.date);
    const key = d.getFullYear() + '-' + d.getMonth();
    if(!groups[key]) groups[key] = {label: monthNames[d.getMonth()] + ' ' + d.getFullYear(), items: []};
    groups[key].items.push(t);
  });
  list.innerHTML = Object.values(groups).map(g => `
    <div class="month-group">
      <div class="month-title"><span class="name">${g.label}</span><span class="count">${g.items.length} مهمة</span></div>
      ${g.items.map(t => {
        const badge = dayLabel(t.date);
        return `
        <div class="task ${t.done ? 'done' : ''}" data-id="${t.id}">
          <button class="check" data-action="toggle" data-id="${t.id}">${t.done ? '✓' : ''}</button>
          <div class="task-body">
            <p class="task-title">${escapeHtml(t.title)}</p>
            ${t.note ? `<p class="task-note">${escapeHtml(t.note)}</p>` : ''}
            <div class="task-meta"><span class="day-badge ${badge.cls}">${badge.text}</span></div>
          </div>
          <button class="del" data-action="delete" data-id="${t.id}">×</button>
        </div>`;
      }).join('')}
    </div>
  `).join('');
}

async function fetchTasks(){
  const { data, error } = await supabase.from('tasks').select('*').order('date', {ascending:true});
  if(!error) { tasks = data; render(); }
}

async function addTask(){
  const titleEl = document.getElementById('title');
  const dateEl = document.getElementById('date');
  const noteEl = document.getElementById('note');
  const title = titleEl.value.trim();
  const date = dateEl.value;
  const note = noteEl.value.trim();
  if(!title || !date) return;
  const { error } = await supabase.from('tasks').insert({ title, note, date, done:false, user_id: currentUser.id });
  if(!error){ titleEl.value=''; dateEl.value=''; noteEl.value=''; fetchTasks(); }
}

async function toggleTask(id){
  const t = tasks.find(x => x.id === id);
  if(!t) return;
  await supabase.from('tasks').update({ done: !t.done }).eq('id', id);
  fetchTasks();
}

async function deleteTask(id){
  await supabase.from('tasks').delete().eq('id', id);
  fetchTasks();
}

document.getElementById('list').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  if(btn.dataset.action === 'toggle') toggleTask(btn.dataset.id);
  else if(btn.dataset.action === 'delete') deleteTask(btn.dataset.id);
});
document.getElementById('addBtn').addEventListener('click', addTask);

// ==== Auth ====
function showApp(user){
  currentUser = user;
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  fetchTasks();
  supabase.channel('tasks-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks', filter: `user_id=eq.${user.id}` }, fetchTasks)
    .subscribe();
}

function showAuth(){
  document.getElementById('authScreen').classList.remove('hidden');
  document.getElementById('appScreen').classList.add('hidden');
}

function setAuthError(msg){
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.classList.toggle('hidden', !msg);
}

document.getElementById('signInBtn').addEventListener('click', async () => {
  setAuthError('');
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if(error) setAuthError('خطأ: ' + error.message);
  else showApp(data.user);
});

document.getElementById('signUpBtn').addEventListener('click', async () => {
  setAuthError('');
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if(!email || !password){ setAuthError('اكتب البريد وكلمة المرور الأول'); return; }
  const { data, error } = await supabase.auth.signUp({ email, password });
  if(error) setAuthError('خطأ: ' + error.message);
  else document.getElementById('authNote').textContent = 'تم إنشاء الحساب. لو مطلوب تأكيد بريد، افتح الإيميل بتاعك، بعدين سجّل دخول.';
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await supabase.auth.signOut();
  showAuth();
});

// check existing session on load
supabase.auth.getSession().then(({ data }) => {
  if(data.session) showApp(data.session.user);
});
</script>
</body>
</html>
